
{% extends 'base.html' %}

{% block head %}
{% endblock %}

{% block body %}
    <h1>Welcome</h1>
    <form method="POST" action="/signIn">
        <label for="userType">Sign in as:</label>
        <select name="userType" id="userType">
            <option value="client">Client</option>
            <option value="agent">Agent</option>
        </select>
        <br>
        <label for="userId">Enter your id:</label>
        <input type="number" name="userId" placeholder="Enter here">
        <button type="submit" style="background-color:rgb(47, 167, 101); color:white;">
            Sign In
        </button>
    </form>
    <br>
    <a href="/client_sign_up_page">
        <button style="background-color:rgb(47, 167, 101); color:white;">
            Client Sign Up
        </button>
    </a>
    <a href="/agent_sign_up_page">
        <button style="background-color:rgb(47, 167, 101); color:white;">
            Agent Sign Up
        </button>
    </a>
    <br>
    <br>
    <a href="properties">
        <button style="background-color:white;
                font-size: 24px;">
            View Listed Properties
        </button>
    </a>
    <a href="/agents">
        <button style="background-color:white;
                font-size: 24px;">
            View Agents
        </button>
    </a>
    <br>
    <br>
{% endblock %}
